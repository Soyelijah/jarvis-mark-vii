name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd web-interface/backend
        npm ci
    
    - name: Run backend tests
      run: |
        cd web-interface/backend
        npx jest --passWithNoTests --ci
    
    - name: Generate coverage report
      run: |
        cd web-interface/backend
        npx jest --coverage --passWithNoTests
      continue-on-error: true

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: web-interface/frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd web-interface/frontend
        npm ci
    
    - name: Run frontend tests
      run: |
        cd web-interface/frontend
        npm run test:run
      continue-on-error: true

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: web-interface/frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd web-interface/frontend
        npm ci
    
    - name: Build production bundle
      run: |
        cd web-interface/frontend
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: web-interface/frontend/dist/
        retention-days: 7

  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check file sizes
      run: |
        echo "📊 Checking repository size..."
        du -sh .
        echo "📁 Largest directories:"
        du -h --max-depth=1 | sort -hr | head -10
    
    - name: Count lines of code
      run: |
        echo "📝 Lines of code statistics:"
        find . -name "*.js" -o -name "*.jsx" -o -name "*.cjs" | grep -v node_modules | xargs wc -l | tail -1
